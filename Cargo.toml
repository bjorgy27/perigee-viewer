[package]
name = "perigee-viewer"
version = "0.1.0"
edition = "2024"

# The viewer is a library so perigee-control can embed it; the binary is a thin wrapper.
[lib]
name = "perigee_viewer"
path = "src/lib.rs"

[[bin]]
name = "perigee-viewer"
path = "src/main.rs"

[dependencies]
perigee-orbit = { path = "../Perigee/orbit" }   # the engine's RK4 + J2 + drag propagator, shared with the PC
nalgebra = { version = "0.35", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
toml = "0.8"
ureq = "2"

# Only the plugins the viewer uses, no audio.
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_gizmos", "bevy_pbr", "bevy_picking",
    "bevy_render", "bevy_state", "bevy_text", "bevy_ui", "bevy_ui_picking_backend", "bevy_window",
    "bevy_winit", "multi_threaded", "tonemapping_luts", "hdr", "smaa_luts", "x11", "wayland",
] }

# Faster incremental rebuilds while developing (optional)
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
